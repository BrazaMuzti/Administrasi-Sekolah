project_id = "administrasi-sekolah"

[functions.buat-akun]
verify_jwt = true

# unggah-foto-murid: verify_jwt=false karena murid "lokal" (login NIS+password,
# tanpa akun Supabase Auth) hanya punya token sesi aplikasi. Otorisasi ditangani
# di dalam fungsi + RPC simpan_foto_murid (security definer).
[functions.unggah-foto-murid]
verify_jwt = false

# ambil-foto-drive: verify_jwt=false karena dipanggil fetch anonim (tanpa cookie
# Google / tanpa sesi Auth) dari halaman untuk membaca foto murid. Hanya GET
# read-only via service account; file yang bisa diambil cuma yang publik "siapa
# saja" atau milik SA/Shared Drive aplikasi.
[functions.ambil-foto-drive]
verify_jwt = false
